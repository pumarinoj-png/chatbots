<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot de Acuerdos de Trabajo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 700px;
            overflow: hidden;
        }
        
        .header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            background: #f8f9fa;
        }
        
        .header h1 {
            font-size: 20px;
            color: #333;
            margin-bottom: 4px;
        }
        
        .header p {
            font-size: 13px;
            color: #666;
        }
        
        .header .bot-mode {
            font-size: 12px;
            color: #667eea;
            font-weight: 500;
            margin-top: 8px;
        }
        
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafa;
        }
        
        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.bot {
            justify-content: flex-start;
        }
        
        .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .user .bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 2px;
        }
        
        .bot .bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 2px;
        }
        
        .input-area {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            background: white;
        }
        
        .input-group {
            flex: 1;
            display: flex;
            gap: 8px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .reset-btn {
            background: #999;
            padding: 10px 14px;
            font-size: 13px;
        }
        
        .reset-btn:hover {
            background: #777;
        }
        
        .attitude-selection {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }
        
        .attitude-btn {
            padding: 16px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 13px;
        }
        
        .attitude-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .attitude-btn .emoji {
            font-size: 24px;
            display: block;
            margin-bottom: 8px;
        }
        
        .attitude-btn .name {
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
        }
        
        .attitude-btn .desc {
            font-size: 11px;
            color: #999;
        }
        
        .context-badge {
            display: inline-block;
            background: #fff3cd;
            color: #856404;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-top: 8px;
            font-weight: 500;
        }
        
        .timestamp {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💼 Colaborador(a) de Acuerdos</h1>
            <p>Dialogue constructivamente sobre los acuerdos de trabajo de tu equipo</p>
            <div class="bot-mode" id="botMode"></div>
        </div>
        
        <div class="chat-area" id="chatArea"></div>
        
        <div class="input-area">
            <div class="input-group">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Escribe tu mensaje..."
                    autocomplete="off"
                    disabled
                >
                <button onclick="sendMessage()" id="sendBtn" disabled>Enviar</button>
            </div>
            <button class="reset-btn" onclick="resetChat()">Reiniciar</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const botModeDisplay = document.getElementById('botMode');
        
        // Estados del chatbot
        const STATES = {
            GREETING: 'greeting',
            SELECTING_ATTITUDE: 'selecting_attitude',
            CONVERSING: 'conversing',
            ANALYZING: 'analyzing',
            FEEDBACK: 'feedback',
            SUCCESS: 'success'
        };
        
        let chatState = {
            currentState: STATES.GREETING,
            topic: null,
            agreement: null,
            presentedElements: {
                resultado: false,
                responsable: false,
                recursos: false,
                interdependencia: false,
                seguimiento: false
            },
            missingElements: [],
            difficulty: null, // easy, medium, hard
            conversationTurns: 0,
            conversationHistory: []
        };
        
        const attitudes = {
            easy: {
                name: 'Amable',
                emoji: '😊',
                description: 'Apoya y facilita la conversación'
            },
            medium: {
                name: 'Reflexivo',
                emoji: '🤔',
                description: 'Cuestiona constructivamente'
            },
            hard: {
                name: 'Crítico',
                emoji: '🎯',
                description: 'Desafía y exige argumentos'
            }
        };
        
        // Respuestas del bot según estado
        const botResponses = {
            greeting: [
                "¡Hola! Soy tu colaborador(a) en la construcción de acuerdos de equipo.",
                "\nEstoy aquí para que conversemos naturalmente sobre los temas que enfrenta tu equipo. Tú hablas, yo escucho y doy feedback constructivo.",
                "\n¿Cuál es tu estilo preferido para que te ayude?"
            ],
            
            afterAttitude: [
                "Perfecto. Vamos a tener una buena conversación.",
                "\nCuéntame: ¿hay algún conflicto o tema en tu equipo que necesite un acuerdo? No es necesario que ya tengas una solución, simplemente cuéntame qué está pasando."
            ],
            
            afterTopic: [
                "Entiendo. Ese es un tema importante.",
                "\nAhora vamos a conversar sobre cómo abordarlo. Te haré preguntas para ayudarte a pensar bien la solución. No es un examen, es un diálogo."
            ]
        };
        
        // Respuestas específicas para cada actitud
        const attitudeResponses = {
            easy: {
                incomplete: "Veo que mencionaste varios puntos. ¿Podrías detallar un poco más? Específicamente:\n\n• ¿Cuál es el resultado esperado? (¿cómo sabrás que funcionó?)\n• ¿Quién es responsable de que esto suceda?\n• ¿Con qué recursos cuentas?\n• ¿Cómo van a dar seguimiento?\n\nNo es obligatorio todo ahora, vamos conversando.",
                complete: "Excelente. Tu acuerdo tiene estructura. Cubriste los puntos clave:\n\n✅ Resultado esperado\n✅ Responsable\n✅ Recursos\n✅ Interdependencia\n✅ Seguimiento\n\nEsto está listo para presentar al equipo. ¡Mucho éxito!"
            },
            medium: {
                incomplete: "Entiendo tu propuesta. Déjame hacerte un par de preguntas para que sea más sólido:\n\n¿Qué resultado concreto esperas? Sin esto, cuando le presentes al equipo, no sabrán si está funcionando o no.\n\n¿Quién específicamente es responsable? ¿Tú solo o con apoyo de alguien?\n\n¿Cómo van a medir que funcionó?",
                complete: "Bien. Tu acuerdo tiene lógica. Los puntos están claros:\n\n✅ Resultado (medible)\n✅ Responsable (definido)\n✅ Recursos (identificados)\n✅ Interdependencia (considerada)\n✅ Seguimiento (pautado)\n\nEsto es un acuerdo que el equipo puede ejecutar. Está listo."
            },
            hard: {
                incomplete: "Escúchame bien: eso que propones está incompleto. No me estás diciendo:\n\n1. ¿CUÁL ES EL RESULTADO OBSERVABLE? ¿Cómo medís que funciona? ¿Con números? ¿Con comportamientos?\n\n2. ¿Quién ESPECÍFICAMENTE es responsable? ¿Y si esa persona no está? ¿Quién toma el relevo?\n\n3. ¿Tienes VERIFICADO que los recursos existen? ¿O asumir nomás?\n\n4. ¿Qué equipos dependen de esto? ¿Hay conflictos?\n\n5. ¿CADA CUÁNDO validas que está funcionando? ¿Semanal? ¿Mensual? ¿Quién reporta?\n\nSin esto, cuando lo presentes el equipo te va a desmenuzar punto por punto. ¿Quieres pensarlo mejor?",
                complete: "Listo. Finalmente cubriste todo. Tu acuerdo tiene estructura:\n\n✅ Resultado (observable y medible)\n✅ Responsable (claro, con escalaciones)\n✅ Recursos (verificados)\n✅ Interdependencia (mapeada)\n✅ Seguimiento (con frecuencia definida)\n\nAhora sí. Lleva esto al equipo con confianza. Ellos verán que pensaste bien."
            }
        };
        
        // Función para seleccionar actitud
        function selectAttitude() {
            addBotMessage(botResponses.greeting.join(''));
            
            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'attitude-selection';
            optionsDiv.style.padding = '12px 0';
            
            Object.keys(attitudes).forEach(key => {
                const att = attitudes[key];
                const btn = document.createElement('button');
                btn.className = 'attitude-btn';
                btn.innerHTML = `
                    <span class="emoji">${att.emoji}</span>
                    <div class="name">${att.name}</div>
                    <div class="desc">${att.description}</div>
                `;
                btn.onclick = () => setAttitude(key);
                optionsDiv.appendChild(btn);
            });
            
            chatArea.appendChild(optionsDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            chatState.currentState = STATES.SELECTING_ATTITUDE;
        }
        
        function setAttitude(level) {
            chatState.difficulty = level;
            const att = attitudes[level];
            botModeDisplay.textContent = `Modo: ${att.emoji} ${att.name}`;
            
            messageInput.disabled = false;
            sendBtn.disabled = false;
            
            addBotMessage(botResponses.afterAttitude.join(''));
            chatState.currentState = STATES.CONVERSING;
            focusInput();
        }
        
        // Análisis de elementos en el mensaje
        function analyzeAgreement(text) {
            const lowercase = text.toLowerCase();
            
            const keywords = {
                resultado: ['resultado', 'esperado', 'criterio', 'observable', 'meta', 'objetivo', 'cuando', 'si podemos', 'se vea', 'medib', 'medida', 'metric', 'número', 'porcent', 'reducir', 'aumentar'],
                responsable: ['responsable', 'líder', 'liderará', 'cargo', 'encargado', 'quien', 'responsabilidad', 'yo', 'seré', 'será'],
                recursos: ['recursos', 'elementos', 'herramientas', 'materiales', 'presupuesto', 'con qué', 'software', 'plataforma', 'escritorio', 'conexión', 'equipo'],
                interdependencia: ['interdependencia', 'áreas', 'involucradas', 'causa efecto', 'relación', 'depende', 'impacta', 'afecta', 'otros', 'equipo', 'excepc'],
                seguimiento: ['seguimiento', 'monitoreo', 'revisión', 'cada cuánto', 'frecuencia', 'tracking', 'medición', 'validar', 'revisamos', 'controlar', 'semanal', 'mensual', 'quincenal']
            };
            
            const detected = {};
            Object.keys(keywords).forEach(element => {
                detected[element] = keywords[element].some(keyword => lowercase.includes(keyword));
            });
            
            return detected;
        }
        
        // Enviar mensaje
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            
            addUserMessage(text);
            chatState.conversationHistory.push({ role: 'user', text });
            messageInput.value = '';
            messageInput.focus();
            chatState.conversationTurns++;
            
            setTimeout(() => {
                handleConversation(text);
            }, 500);
        }
        
        function handleConversation(text) {
            if (chatState.currentState === STATES.CONVERSING) {
                // Primera respuesta: identificar si es el tema
                if (chatState.conversationTurns === 1) {
                    chatState.topic = text;
                    addBotMessage(botResponses.afterTopic.join(''));
                    chatState.conversationHistory.push({ role: 'bot', text: botResponses.afterTopic.join('') });
                } 
                // Identificar si está proponiendo un acuerdo
                else if (!chatState.agreement && text.length > 20) {
                    // Detectar si suena como un acuerdo (tiene proposiciones, "deben", "vamos", etc)
                    const soundsLikeAgreement = /deb|vam|propon|plan|acuerd|regla|modo|forma|así|todos|cada|siempre/i.test(text);
                    
                    if (soundsLikeAgreement) {
                        chatState.agreement = text;
                        const detected = analyzeAgreement(text);
                        chatState.presentedElements = detected;
                        chatState.missingElements = Object.keys(detected).filter(el => !detected[el]);
                        
                        if (chatState.missingElements.length > 0) {
                            respondToIncomplete(detected);
                        } else {
                            respondToComplete(detected);
                        }
                    } else {
                        // Sigue conversación general
                        const generalResponses = [
                            "Entiendo. ¿Y qué propuesta tienes para resolver esto? ¿Cómo sería el acuerdo ideal?",
                            "Interesante perspectiva. Entonces, ¿cuál sería tu solución? ¿Qué regla o acuerdo propondrías?",
                            "Claro. Ahora cuéntame, ¿cómo crees que se debería manejar esto? ¿Qué acuerdo traerías al equipo?"
                        ];
                        const response = generalResponses[Math.floor(Math.random() * generalResponses.length)];
                        addBotMessage(response);
                        chatState.conversationHistory.push({ role: 'bot', text: response });
                    }
                } else if (chatState.agreement) {
                    // Está refinando el acuerdo
                    const newDetected = analyzeAgreement(chatState.agreement + " " + text);
                    chatState.presentedElements = newDetected;
                    chatState.missingElements = Object.keys(newDetected).filter(el => !newDetected[el]);
                    
                    if (chatState.missingElements.length > 0) {
                        respondToIncomplete(newDetected);
                    } else {
                        respondToComplete(newDetected);
                    }
                    
                    chatState.agreement += " " + text;
                }
            }
        }
        
        function respondToIncomplete(detected) {
            const missing = chatState.missingElements;
            const displayNames = {
                resultado: 'Resultado esperado (criterio observable)',
                responsable: 'Responsable (quién liderará)',
                recursos: 'Recursos (elementos disponibles)',
                interdependencia: 'Interdependencia (áreas involucradas)',
                seguimiento: 'Seguimiento (frecuencia de revisión)'
            };
            
            let response = attitudeResponses[chatState.difficulty].incomplete;
            
            addBotMessage(response);
            
            const badge = document.createElement('div');
            badge.className = 'context-badge';
            badge.textContent = `Elementos detectados: ${Object.keys(detected).filter(el => detected[el]).length}/5`;
            chatArea.lastElementChild.appendChild(badge);
            
            chatState.conversationHistory.push({ role: 'bot', text: response });
            focusInput();
        }
        
        function respondToComplete(detected) {
            let response = attitudeResponses[chatState.difficulty].complete;
            
            addBotMessage(response);
            chatState.currentState = STATES.SUCCESS;
            chatState.conversationHistory.push({ role: 'bot', text: response });
            focusInput();
        }
        
        // Agregar mensaje a la UI
        function addUserMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message user';
            msgDiv.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function addBotMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message bot';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            msgDiv.appendChild(bubble);
            
            const time = document.createElement('div');
            time.className = 'timestamp';
            time.textContent = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
            msgDiv.appendChild(time);
            
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function focusInput() {
            messageInput.focus();
        }
        
        function resetChat() {
            chatArea.innerHTML = '';
            messageInput.value = '';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            botModeDisplay.textContent = '';
            
            chatState = {
                currentState: STATES.GREETING,
                topic: null,
                agreement: null,
                presentedElements: {
                    resultado: false,
                    responsable: false,
                    recursos: false,
                    interdependencia: false,
                    seguimiento: false
                },
                missingElements: [],
                difficulty: null,
                conversationTurns: 0,
                conversationHistory: []
            };
            
            selectAttitude();
        }
        
        // Utilidades
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Enter para enviar
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !messageInput.disabled) {
                sendMessage();
            }
        });
        
        // Iniciar
        window.addEventListener('load', () => {
            selectAttitude();
        });
    </script>
</body>
</html>
