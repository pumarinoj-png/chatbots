<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversación con el Equipo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 700px;
            overflow: hidden;
        }
        
        .header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            background: #f8f9fa;
        }
        
        .header h1 {
            font-size: 18px;
            color: #333;
            margin-bottom: 4px;
        }
        
        .header p {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .header .colleague-info {
            font-size: 12px;
            color: #667eea;
            font-weight: 500;
        }
        
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafa;
        }
        
        .message-group {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message-group.user {
            justify-content: flex-end;
        }
        
        .message-group.colleague {
            justify-content: flex-start;
        }
        
        .sender-label {
            font-size: 11px;
            font-weight: 600;
            color: #999;
            margin-bottom: 4px;
            margin-left: 4px;
        }
        
        .message-group.user .sender-label {
            text-align: right;
            margin-right: 4px;
        }
        
        .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .message-group.user .bubble {
            background: #667eea;
            color: white;
        }
        
        .message-group.colleague .bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
        }
        
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            background: white;
        }
        
        .input-group {
            flex: 1;
            display: flex;
            gap: 8px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        input[type="text"]:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }
        
        button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        button:hover:not(:disabled) {
            background: #764ba2;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        button:active:not(:disabled) {
            transform: scale(0.98);
        }
        
        .reset-btn {
            background: #999;
            padding: 10px 14px;
            font-size: 13px;
        }
        
        .reset-btn:hover {
            background: #777;
        }
        
        .attitude-selection {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
            padding: 0 0 12px 0;
        }
        
        .attitude-btn {
            padding: 16px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 13px;
        }
        
        .attitude-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .attitude-btn .emoji {
            font-size: 28px;
            display: block;
            margin-bottom: 8px;
        }
        
        .attitude-btn .name {
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
        }
        
        .attitude-btn .desc {
            font-size: 11px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Conversación sobre Acuerdos</h1>
            <p>Un miembro de tu equipo te cuestiona la propuesta</p>
            <div class="colleague-info" id="colleagueInfo"></div>
        </div>
        
        <div class="chat-area" id="chatArea"></div>
        
        <div class="input-area">
            <div class="input-group">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Escribe tu respuesta..."
                    autocomplete="off"
                    disabled
                >
                <button onclick="sendMessage()" id="sendBtn" disabled>Enviar</button>
            </div>
            <button class="reset-btn" onclick="resetChat()">Reiniciar</button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const colleagueInfo = document.getElementById('colleagueInfo');
        
        let chatState = {
            difficulty: null, // easy, medium, hard
            conversationTurns: 0,
            agreementProposed: false,
            elementsCount: 0
        };
        
        const attitudes = {
            easy: {
                name: 'Compañero(a) Solidario',
                emoji: '😊',
                description: 'Solidario pero cuestiona'
            },
            medium: {
                name: 'Compañero(a) Reflexivo',
                emoji: '🤔',
                description: 'Cuestiona de forma balanceada'
            },
            hard: {
                name: 'Compañero(a) Directo',
                emoji: '🎯',
                description: 'Directo y exigente'
            }
        };
        
        // Respuestas de apertura
        const openingLines = {
            easy: "¿Cuéntame qué tema tenés en mente? ¿Qué es lo que no está funcionando en el equipo?",
            medium: "Perfecto. Dime, ¿cuál es el problema específico que querés resolver?",
            hard: "Dale. ¿Cuál es el tema? Cuéntame qué está pasando en el equipo."
        };
        
        // Respuestas a propuestas según actitud
        function generateResponse(userMessage, difficulty, isAgreement) {
            const msg = userMessage.toLowerCase();
            
            if (!chatState.agreementProposed && 
                /deb|vam|propon|plan|acuerd|regla|necesit|deberíamos|podríamos|todos|lunes|miércoles|reunión|venir|presenc/i.test(msg)) {
                chatState.agreementProposed = true;
                return respondToAgreement(userMessage, difficulty);
            }
            
            if (chatState.agreementProposed) {
                return continueChallenge(userMessage, difficulty);
            }
            
            // Respuestas durante la exploración del tema
            return exploreMore(userMessage, difficulty);
        }
        
        function respondToAgreement(proposal, difficulty) {
            if (difficulty === 'easy') {
                const responses = [
                    `Me parece que vas en la dirección correcta con: "${proposal}"\n\nPero dime una cosa, ¿cómo sabríamos que esto realmente funciona? ¿Cuál sería el cambio que querés ver?`,
                    `Bueno, la idea tiene sentido, pero necesito entender mejor: ¿quién se encarga de que esto se cumpla? ¿Solo vos o todo el equipo tiene que hacer algo?`,
                    `Está bien, pero hay algo que me preocupa: ¿qué pasa si hay alguien que no puede cumplir con eso? ¿Hay excepciones o es obligatorio para todos?`
                ];
                return responses[Math.floor(Math.random() * responses.length)];
            } 
            else if (difficulty === 'medium') {
                const responses = [
                    `Mira, lo que decís suena bien en teoría, pero necesito que seas más específico/a: ¿cuál es exactamente el resultado que esperas?\n\nPorque si no sabemos qué es "éxito" en esto, después no vamos a saber si funcionó o no.`,
                    `Entiendo, pero tengo mis dudas. ¿Quién exactamente va a garantizar que esto se cumple? Y más importante: ¿cada cuánto lo revisamos para ver si está funcionando?`,
                    `Está claro lo que querés, pero me falta información: ¿con qué recursos contamos? ¿Hay algo que el equipo necesita para que esto funcione?`
                ];
                return responses[Math.floor(Math.random() * responses.length)];
            }
            else { // hard
                const responses = [
                    `Espera. Vos me dices "${proposal}" pero eso es muy vago. ¿Cuál es específicamente el problema que esto resuelve? Y más importante: ¿cómo medís que funcionó?\n\nSin métricas claras, cualquiera puede decir que es un éxito.`,
                    `No me cierra. Vos proponés esto pero ¿quién garantiza que se cumpla? Porque si nadie es responsable específicamente, esto se cae en una semana.`,
                    `Mira, no quiero ser difícil, pero falta claridad. ¿Esto afecta a otras áreas? ¿Hay dependencias que no estamos considerando?\n\nBecause si implementamos esto y genera conflictos con otro equipo, estamos en problemas.`
                ];
                return responses[Math.floor(Math.random() * responses.length)];
            }
        }
        
        function continueChallenge(userMessage, difficulty) {
            chatState.conversationTurns++;
            
            if (difficulty === 'easy') {
                const continuations = [
                    `Bueno, eso tiene más sentido. Pero una cosa más: ¿cómo hace el equipo para saber si está yendo bien? ¿Hay alguna forma de validar esto?`,
                    `Dale, voy entendiendo mejor. Y si al equipo le cuesta cumplir con esto, ¿hay flexibilidad o es inamovible?`,
                    `Veo. Pero me gustaría que pensáramos juntos: ¿hay algo que podría salir mal en esto? ¿Algún obstáculo que ya conocemos?`
                ];
                return continuations[Math.floor(Math.random() * continuations.length)];
            }
            else if (difficulty === 'medium') {
                const continuations = [
                    `Claro, eso tiene lógica. Ahora bien, ¿el equipo está de acuerdo con esto? Porque a veces las propuestas que parecen buenas después generan fricción.`,
                    `Entendido. Pero aquí va mi preocupación: sin un responsable claro que lo supervise, esto tiende a relajarse. ¿Cómo lo monitoreamos?`,
                    `Ok, pero hay un detalle que me preocupa: ¿y si surgen conflictos con cómo trabajamos en otras áreas? ¿Esto podría generar problemas?`
                ];
                return continuations[Math.floor(Math.random() * continuations.length)];
            }
            else { // hard
                const continuations = [
                    `Eso es mejor. Pero te falta decir: ¿quién específicamente va a estar pendiente de que esto se cumpla? Porque "todos" nunca funciona.`,
                    `Vamos bien. Pero necesito que pienses en esto: ¿y si en 2 semanas vemos que no está funcionando? ¿Qué hacemos? ¿Lo cancelamos? ¿Lo ajustamos cómo?`,
                    `Está más claro. Pero el problema real es la ejecución. ¿Cómo garantizamos que el equipo lo entienda de la misma forma que vos? Porque la mayoría de los acuerdos fracasan por malinterpretación.`
                ];
                return continuations[Math.floor(Math.random() * continuations.length)];
            }
        }
        
        function exploreMore(userMessage, difficulty) {
            const msg = userMessage.toLowerCase();
            
            if (/porqué|qué|cuál|cómo|dónde/i.test(msg) || msg.length < 30) {
                return continueExploring(difficulty);
            }
            
            const responses = {
                easy: [
                    "Entiendo. ¿Y eso cómo impactaría en el día a día del equipo?",
                    "Tiene sentido. Contame más, ¿qué sería lo ideal para resolver esto?",
                    "Ok. ¿Y si pensamos en una solución, cuál sería el primer paso?"
                ],
                medium: [
                    "Claro. Pero ¿cuál sería específicamente la solución ideal? ¿Qué tendría que pasar para que esto se arregle?",
                    "Entiendo el problema. Ahora, ¿cuál crees que es el acuerdo o regla que falta?",
                    "Está claro. ¿Y qué propuesta tenés vos para resolverlo?"
                ],
                hard: [
                    "Claro, el problema está ahí. Pero ¿cuál es tu solución? ¿Qué acuerdo propondrías vos?",
                    "Ok. Entonces, si tuvieras que proponer algo concreto, ¿qué sería?",
                    "Eso es el problema. ¿Y cuál es tu idea para arreglarlo?"
                ]
            };
            
            return responses[difficulty][Math.floor(Math.random() * responses[difficulty].length)];
        }
        
        function continueExploring(difficulty) {
            const responses = {
                easy: [
                    "Claro. ¿Hay algo más del problema que debería saber?",
                    "Entiendo. ¿Es algo que afecta a todo el equipo o a algunas personas específicamente?"
                ],
                medium: [
                    "Aja. ¿Y eso es nuevo o viene desde hace tiempo?",
                    "¿Entonces el problema es recurrente? ¿O fue algo puntual?"
                ],
                hard: [
                    "¿Y hace cuánto que pasa esto?",
                    "¿Es algo que solo notás vos o el equipo entero lo ve?"
                ]
            };
            
            return responses[difficulty][Math.floor(Math.random() * responses[difficulty].length)];
        }
        
        function selectAttitude() {
            addBotMessage("¿Cuál es tu estilo? Así sé cómo cuestionarte:");
            
            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'attitude-selection';
            
            Object.keys(attitudes).forEach(key => {
                const att = attitudes[key];
                const btn = document.createElement('button');
                btn.className = 'attitude-btn';
                btn.innerHTML = `
                    <span class="emoji">${att.emoji}</span>
                    <div class="name">${att.name}</div>
                    <div class="desc">${att.description}</div>
                `;
                btn.onclick = () => setAttitude(key);
                optionsDiv.appendChild(btn);
            });
            
            chatArea.appendChild(optionsDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function setAttitude(level) {
            chatState.difficulty = level;
            const att = attitudes[level];
            colleagueInfo.textContent = `Eres: ${att.emoji} ${att.name}`;
            
            messageInput.disabled = false;
            sendBtn.disabled = false;
            
            addBotMessage(openingLines[level]);
            focusInput();
        }
        
        function addBotMessage(text) {
            const messageGroup = document.createElement('div');
            messageGroup.className = 'message-group colleague';
            
            const label = document.createElement('div');
            label.className = 'sender-label';
            label.textContent = 'Compañero(a)';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            
            messageGroup.appendChild(label);
            messageGroup.appendChild(bubble);
            chatArea.appendChild(messageGroup);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function addUserMessage(text) {
            const messageGroup = document.createElement('div');
            messageGroup.className = 'message-group user';
            
            const label = document.createElement('div');
            label.className = 'sender-label';
            label.textContent = 'Tú (Jefe)';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            
            messageGroup.appendChild(label);
            messageGroup.appendChild(bubble);
            chatArea.appendChild(messageGroup);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            
            addUserMessage(text);
            messageInput.value = '';
            focusInput();
            
            setTimeout(() => {
                const response = generateResponse(text, chatState.difficulty);
                addBotMessage(response);
            }, 800);
        }
        
        function focusInput() {
            messageInput.focus();
        }
        
        function resetChat() {
            chatArea.innerHTML = '';
            messageInput.value = '';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            colleagueInfo.textContent = '';
            
            chatState = {
                difficulty: null,
                conversationTurns: 0,
                agreementProposed: false,
                elementsCount: 0
            };
            
            selectAttitude();
        }
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !messageInput.disabled) {
                sendMessage();
            }
        });
        
        window.addEventListener('load', () => {
            selectAttitude();
        });
    </script>
</body>
</html>
