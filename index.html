<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversación con el Equipo</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .container {
            width: 100%; max-width: 900px; background: white;
            border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; height: 85vh; max-height: 750px; overflow: hidden;
        }
        .header { padding: 16px 20px; border-bottom: 1px solid #e0e0e0; background: #f8f9fa; }
        .header h1 { font-size: 17px; color: #333; margin-bottom: 2px; }
        .header p  { font-size: 12px; color: #888; }
        .header .mode { font-size: 12px; color: #667eea; font-weight: 600; margin-top: 5px; min-height: 14px; }

        .phase-bar {
            display: flex; border-bottom: 1px solid #e0e0e0;
        }
        .phase-tab {
            flex: 1; padding: 10px; text-align: center; font-size: 12px;
            font-weight: 600; color: #bbb; border-bottom: 3px solid transparent;
            transition: all 0.3s; cursor: default; background: #fafafa;
        }
        .phase-tab.active { color: #667eea; border-bottom-color: #667eea; background: white; }
        .phase-tab.done   { color: #1D9E75; border-bottom-color: #1D9E75; background: white; }

        .chat-area {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 14px; background: #fafafa;
        }
        .msg { display: flex; flex-direction: column; }
        .msg.user { align-items: flex-end; }
        .msg.bot  { align-items: flex-start; }
        .who { font-size: 11px; font-weight: 600; color: #aaa; margin-bottom: 4px; padding: 0 4px; }
        .bubble {
            max-width: 70%; padding: 12px 16px; border-radius: 12px;
            font-size: 14px; line-height: 1.55; word-wrap: break-word; white-space: pre-wrap;
        }
        .msg.user .bubble { background: #667eea; color: white; }
        .msg.bot  .bubble { background: white; color: #333; border: 1px solid #e0e0e0; }

        .typing { display:flex; align-items:center; gap:5px; padding:12px 16px; background:white; border:1px solid #e0e0e0; border-radius:12px; width:fit-content; }
        .typing span { width:7px; height:7px; background:#999; border-radius:50%; animation:bounce 1.2s infinite; }
        .typing span:nth-child(2){animation-delay:0.2s}
        .typing span:nth-child(3){animation-delay:0.4s}
        @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}

        .divider {
            display: flex; align-items: center; gap: 12px;
            padding: 8px 0; margin: 4px 0;
        }
        .divider hr { flex: 1; border: none; border-top: 1px dashed #ddd; }
        .divider span { font-size: 11px; color: #bbb; white-space: nowrap; }

        .phase2-trigger {
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; gap: 10px;
        }
        .phase2-trigger p {
            font-size: 13px; color: #888; text-align: center; line-height: 1.5; max-width: 320px;
        }
        .phase2-btn {
            padding: 12px 28px; background: #764ba2; color: white; border: none;
            border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: background 0.2s; margin-top: 4px;
        }
        .phase2-btn:hover { background: #5a3580; }

        .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-top:14px; }
        .att-btn {
            padding:16px 12px; background:white; border:2px solid #e0e0e0;
            border-radius:10px; cursor:pointer; text-align:center; transition:all 0.25s; font-family:inherit;
        }
        .att-btn:hover { border-color:#667eea; background:#f5f5ff; }
        .att-btn:disabled { opacity:0.5; cursor:default; }
        .att-btn .ico  { font-size:28px; display:block; margin-bottom:8px; }
        .att-btn .name { font-size:13px; font-weight:600; color:#333; margin-bottom:3px; }
        .att-btn .sub  { font-size:11px; color:#999; }

        .input-area { padding:14px 18px; border-top:1px solid #e0e0e0; display:flex; gap:10px; background:white; }
        input[type="text"] {
            flex:1; padding:11px 14px; border:1px solid #ddd; border-radius:8px;
            font-size:14px; font-family:inherit; transition:border-color 0.2s;
        }
        input[type="text"]:focus { outline:none; border-color:#667eea; box-shadow:0 0 0 3px rgba(102,126,234,0.1); }
        input[type="text"]:disabled { background:#f5f5f5; }
        .send-btn {
            padding:11px 22px; background:#667eea; color:white; border:none;
            border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; font-family:inherit; transition: background 0.2s;
        }
        .send-btn:hover:not(:disabled){background:#764ba2}
        .send-btn:disabled{background:#ccc;cursor:not-allowed}
        .reset-btn {
            padding:11px 14px; background:#f0f0f0; color:#555; border:none;
            border-radius:8px; font-size:13px; cursor:pointer; font-family:inherit;
        }
        .reset-btn:hover{background:#e0e0e0}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>💬 Conversación con el equipo</h1>
        <p>Practica cómo construir y sostener acuerdos</p>
        <div class="mode" id="modeLabel"></div>
    </div>

    <div class="phase-bar">
        <div class="phase-tab active" id="tab1">1 · Construir el acuerdo</div>
        <div class="phase-tab" id="tab2">2 · Sostener el acuerdo</div>
    </div>

    <div class="chat-area" id="chatArea"></div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Escribe tu mensaje..." disabled autocomplete="off">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>Enviar</button>
        <button class="reset-btn" onclick="resetChat()">Reiniciar</button>
    </div>
</div>

<script>
const chatArea  = document.getElementById('chatArea');
const msgInput  = document.getElementById('msgInput');
const sendBtn   = document.getElementById('sendBtn');
const modeLabel = document.getElementById('modeLabel');
const tab1      = document.getElementById('tab1');
const tab2      = document.getElementById('tab2');

let difficulty  = null;
let phase       = 1; // 1 o 2
let history1    = []; // historial fase 1
let history2    = []; // historial fase 2
let agreementSummary = ''; // resumen del acuerdo para fase 2

// Razones de incumplimiento — se elige una al azar al iniciar fase 2
const nonComplianceReasons = [
    {
        tag: 'forgot',
        internal: 'Se te olvidó cumplir el acuerdo. No fue intencional, simplemente se perdió entre otras prioridades. Al principio no lo admites directamente, dices que "estabas en eso" o que "fue una semana complicada". Solo si te presionan bien confiesas que se te fue.'
    },
    {
        tag: 'disagree',
        internal: 'En el fondo nunca estuviste convencido/a del acuerdo. Lo aceptaste en la reunión para no generar conflicto, pero no lo cumpliste porque no crees que sea la solución correcta. Al principio evitás el tema, pero si te presionan empezás a cuestionar el acuerdo mismo.'
    },
    {
        tag: 'obstacle',
        internal: 'Quisiste cumplir pero tuviste un obstáculo real: falta de tiempo, de recursos, o de información. No lo comunicaste porque no quisiste parecer incapaz. Al principio decís que "lo estás resolviendo", pero si te preguntan bien reconocés que necesitabas algo que no tenías.'
    },
    {
        tag: 'unclear',
        internal: 'No entendiste bien qué se esperaba exactamente de vos. El acuerdo te pareció ambiguo y no quisiste preguntar para no quedar mal. Actuaste según tu propia interpretación, que resultó ser distinta. Al principio decís que sí cumpliste, hasta que queda claro que no es lo mismo.'
    },
    {
        tag: 'priority',
        internal: 'Entendiste el acuerdo pero tuviste otras urgencias que consideraste más importantes. Priorizaste otras tareas sin avisar. Al principio lo justificás con las urgencias, pero si te aprietan bien reconocés que debiste haber comunicado el cambio de prioridad.'
    }
];

const attitudes = {
    easy: {
        emoji:'😊', name:'Solidario/a', sub:'Apoya pero tiene preguntas',
        system1: `Estás en el rol de un/a colaborador/a hablando con tu jefe/a directo/a. Tu actitud es SOLIDARIA y CURIOSA.
- Eres una persona real del equipo. Primera persona, tono casual.
- Cuando tu jefe propone algo, apoyás pero hacés UNA sola pregunta concreta.
- Nunca dos preguntas a la vez. Esperás la respuesta antes de seguir.
- Tono cálido: "claro, tiene sentido, pero...", "entiendo, y si...".
- NUNCA uses términos de gestión. Sos un colega normal.
- Cuando todo esté claro: "ok, me parece bien. Lo llevamos al equipo".
- Máximo 2-3 líneas por respuesta.`
    },
    medium: {
        emoji:'🤔', name:'Reflexivo/a', sub:'Cuestiona de forma balanceada',
        system1: `Estás en el rol de un/a colaborador/a hablando con tu jefe/a directo/a. Tu actitud es REFLEXIVA y algo ESCÉPTICA.
- Eres una persona real del equipo. Primera persona, directo y honesto.
- Cuando tu jefe propone algo, señalás UNA cosa que no te cierra por turno.
- No aceptás respuestas vagas. Pedís precisión.
- "no me queda del todo claro", "eso me preocupa un poco", "¿y si...?".
- NUNCA uses términos de gestión. Sos un colega normal.
- Cuando todo esté claro: "bueno, así tiene más sentido. Puedo sostenerlo con el equipo".
- Máximo 2-3 líneas.`
    },
    hard: {
        emoji:'🎯', name:'Directo/a', sub:'Cuestiona sin filtros',
        system1: `Estás en el rol de un/a colaborador/a hablando con tu jefe/a directo/a. Tu actitud es DIRECTA y EXIGENTE.
- Eres una persona real del equipo. Primera persona, franco sin rodeos, respetuoso.
- Cuando tu jefe propone algo, hacés UNA pregunta directa y exigente por turno.
- "no me cierra", "eso es muy vago", "¿y si no se cumple qué pasa?".
- NUNCA uses términos de gestión. Sos un colega normal.
- Solo cuando todo esté claro: "ok, ahora sí me convence. Podemos llevarlo".
- Máximo 2-3 líneas.`
    }
};

const greeting1 = {
    easy:   "Hola, me llamaste. ¿Qué hay?",
    medium: "Hola, me llamaste. Cuéntame.",
    hard:   "Hola, me llamaste. ¿Qué pasa?"
};

const greeting2 = {
    easy:   "Hola. ¿Me necesitabas?",
    medium: "Hola. ¿Qué pasó?",
    hard:   "Hola. Dime."
};

function buildSystem2(reason) {
    return `Estás en el rol de un/a colaborador/a que NO cumplió un acuerdo que habías hecho con tu jefe/a.

EL ACUERDO ERA: ${agreementSummary || 'un acuerdo de trabajo que habían pactado juntos'}

POR QUÉ NO CUMPLISTE (solo vos lo sabés, no lo digas directamente al principio):
${reason.internal}

CÓMO COMPORTARTE:
- Eres una persona real. Primera persona, tono natural.
- Al principio no admitís el incumplimiento fácilmente. Podés decir que "estabas en eso", que "fue una semana complicada", que "lo estás viendo".
- A medida que tu jefe/a te presiona o hace buenas preguntas, vas revelando la razón real poco a poco.
- Si tu jefe/a escucha bien y propone soluciones concretas, empezás a ceder y comprometerte de nuevo.
- Si te presionan sin escucharte, te cerrás un poco más.
- Respondés con frases cortas y naturales. Sin discursos.
- NUNCA uses términos de gestión. Sos un colega normal.
- Máximo 2-3 líneas por respuesta.`;
}

async function callAPI(msgs, sys) {
    const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 200,
            system: sys,
            messages: msgs
        })
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    return d.content?.[0]?.text || "...";
}

function showTyping() {
    const w = document.createElement('div');
    w.className = 'msg bot'; w.id = 'typing';
    const who = document.createElement('div');
    who.className = 'who'; who.textContent = 'Compañero/a';
    const t = document.createElement('div');
    t.className = 'typing'; t.innerHTML = '<span></span><span></span><span></span>';
    w.appendChild(who); w.appendChild(t);
    chatArea.appendChild(w); chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() { const t=document.getElementById('typing'); if(t)t.remove(); }

function addMsg(role, text) {
    const w = document.createElement('div');
    w.className = `msg ${role==='user'?'user':'bot'}`;
    const who = document.createElement('div');
    who.className = 'who'; who.textContent = role==='user'?'Tú (Jefatura)':'Compañero/a';
    const b = document.createElement('div');
    b.className = 'bubble'; b.textContent = text;
    w.appendChild(who); w.appendChild(b);
    chatArea.appendChild(w); chatArea.scrollTop = chatArea.scrollHeight;
}

function addDivider(text) {
    const d = document.createElement('div');
    d.className = 'divider';
    d.innerHTML = `<hr><span>${text}</span><hr>`;
    chatArea.appendChild(d);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function showPhase2Trigger() {
    // Deshabilitar input
    msgInput.disabled = true;
    sendBtn.disabled = true;

    addDivider('Conversación 1 finalizada');

    const wrap = document.createElement('div');
    wrap.className = 'phase2-trigger';
    wrap.innerHTML = `
        <p>Han pasado unos días. Tu compañero/a <strong>no cumplió el acuerdo</strong>.<br>Cuando estés listo/a, inicia la segunda conversación.</p>
        <button class="phase2-btn" onclick="startPhase2()">🔄 Iniciar Conversación 2</button>
    `;
    chatArea.appendChild(wrap);
    chatArea.scrollTop = chatArea.scrollHeight;
}

async function startPhase2() {
    phase = 2;
    tab1.classList.remove('active'); tab1.classList.add('done');
    tab2.classList.add('active');
    modeLabel.textContent = `${attitudes[difficulty].emoji} ${attitudes[difficulty].name} · Fase 2: Sostener el acuerdo`;

    // Eliminar el botón trigger
    const trigger = chatArea.querySelector('.phase2-trigger');
    if (trigger) trigger.remove();

    addDivider('Conversación 2 — días después');

    // Elegir razón aleatoria
    const reason = nonComplianceReasons[Math.floor(Math.random() * nonComplianceReasons.length)];

    // Construir resumen del acuerdo desde el historial 1
    agreementSummary = history1
        .filter(m => m.role === 'user')
        .map(m => m.content)
        .join(' ');

    const sys2 = buildSystem2(reason);
    const first = greeting2[difficulty];
    history2.push({ role: 'assistant', content: first });
    addMsg('bot', first);

    // Guardar system2 globalmente
    window._sys2 = sys2;

    msgInput.disabled = false;
    sendBtn.disabled = false;
    msgInput.focus();
}

async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;
    msgInput.value = ''; msgInput.disabled = true; sendBtn.disabled = true;
    addMsg('user', text);

    const currentHistory = phase === 1 ? history1 : history2;
    const currentSystem  = phase === 1
        ? attitudes[difficulty].system1
        : window._sys2;

    currentHistory.push({ role:'user', content:text });
    showTyping();

    try {
        const reply = await callAPI(currentHistory, currentSystem);
        hideTyping(); addMsg('bot', reply);
        currentHistory.push({ role:'assistant', content:reply });

        // Detectar fin de fase 1
        if (phase === 1) {
            const endPhrases = ['llevamos al equipo', 'me convence', 'podemos llevarlo', 'tiene más sentido', 'me parece bien'];
            if (endPhrases.some(p => reply.toLowerCase().includes(p))) {
                setTimeout(showPhase2Trigger, 1000);
                msgInput.disabled = true;
                sendBtn.disabled = true;
                return;
            }
        }
    } catch(e) {
        hideTyping(); addMsg('bot', 'Error al conectar. Intenta de nuevo.');
    }

    msgInput.disabled = false; sendBtn.disabled = false; msgInput.focus();
}

function selectAttitude() {
    const w = document.createElement('div'); w.className = 'msg bot';
    const lbl = document.createElement('div');
    lbl.style.cssText = 'font-size:14px;color:#555;margin-bottom:10px;';
    lbl.textContent = 'Elige la actitud de tu contraparte:';
    const grid = document.createElement('div'); grid.className = 'grid';
    Object.entries(attitudes).forEach(([key, att]) => {
        const btn = document.createElement('button'); btn.className = 'att-btn';
        btn.innerHTML = `<span class="ico">${att.emoji}</span><div class="name">${att.name}</div><div class="sub">${att.sub}</div>`;
        btn.onclick = () => {
            grid.querySelectorAll('.att-btn').forEach(b=>b.disabled=true);
            setAttitude(key);
        };
        grid.appendChild(btn);
    });
    w.appendChild(lbl); w.appendChild(grid); chatArea.appendChild(w);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function setAttitude(level) {
    difficulty = level;
    modeLabel.textContent = `${attitudes[level].emoji} ${attitudes[level].name} · Fase 1: Construir el acuerdo`;
    msgInput.disabled = false; sendBtn.disabled = false;
    const first = greeting1[level];
    history1.push({ role:'assistant', content:first });
    addMsg('bot', first);
    msgInput.focus();
}

function resetChat() {
    chatArea.innerHTML = ''; msgInput.value = '';
    msgInput.disabled = true; sendBtn.disabled = true;
    modeLabel.textContent = ''; difficulty = null;
    phase = 1; history1 = []; history2 = [];
    agreementSummary = ''; window._sys2 = null;
    tab1.className = 'phase-tab active'; tab2.className = 'phase-tab';
    selectAttitude();
}

msgInput.addEventListener('keypress', e => { if(e.key==='Enter'&&!msgInput.disabled) sendMessage(); });
window.addEventListener('load', selectAttitude);
</script>
</body>
</html>
