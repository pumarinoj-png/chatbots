<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversación con el Equipo</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .container {
            width: 100%; max-width: 900px; background: white;
            border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; height: 85vh; max-height: 750px; overflow: hidden;
        }
        .header { padding: 16px 20px; border-bottom: 1px solid #e0e0e0; background: #f8f9fa; }
        .header h1 { font-size: 17px; color: #333; margin-bottom: 2px; }
        .header p  { font-size: 12px; color: #888; }
        .header .mode { font-size: 12px; color: #667eea; font-weight: 600; margin-top: 5px; min-height: 14px; }

        .phase-bar { display: flex; border-bottom: 1px solid #e0e0e0; }
        .phase-tab {
            flex: 1; padding: 10px; text-align: center; font-size: 12px;
            font-weight: 600; color: #bbb; border-bottom: 3px solid transparent;
            transition: all 0.3s; background: #fafafa;
        }
        .phase-tab.clickable { cursor: pointer; }
        .phase-tab.clickable:hover { color: #667eea; background: #f0f0ff; }
        .phase-tab.active { color: #667eea; border-bottom-color: #667eea; background: white; }
        .phase-tab.done   { color: #1D9E75; border-bottom-color: #1D9E75; background: white; cursor: pointer; }

        .chat-area {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 14px; background: #fafafa;
        }
        .msg { display: flex; flex-direction: column; }
        .msg.user { align-items: flex-end; }
        .msg.bot  { align-items: flex-start; }
        .who { font-size: 11px; font-weight: 600; color: #aaa; margin-bottom: 4px; padding: 0 4px; }
        .bubble {
            max-width: 70%; padding: 12px 16px; border-radius: 12px;
            font-size: 14px; line-height: 1.55; word-wrap: break-word; white-space: pre-wrap;
        }
        .msg.user .bubble { background: #667eea; color: white; }
        .msg.bot  .bubble { background: white; color: #333; border: 1px solid #e0e0e0; }

        .typing { display:flex; align-items:center; gap:5px; padding:12px 16px; background:white; border:1px solid #e0e0e0; border-radius:12px; width:fit-content; }
        .typing span { width:7px; height:7px; background:#999; border-radius:50%; animation:bounce 1.2s infinite; }
        .typing span:nth-child(2){animation-delay:0.2s}
        .typing span:nth-child(3){animation-delay:0.4s}
        @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}

        .divider {
            display: flex; align-items: center; gap: 12px; padding: 8px 0; margin: 4px 0;
        }
        .divider hr { flex: 1; border: none; border-top: 1px dashed #ddd; }
        .divider span { font-size: 11px; color: #bbb; white-space: nowrap; }

        /* Modal de feedback */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.4); z-index: 100;
            align-items: center; justify-content: center; overflow-y: auto;
        }
        .modal-overlay.visible { display: flex; }
        .modal {
            background: white; border-radius: 12px; padding: 28px 32px;
            max-width: 420px; width: 90%; box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            margin: 20px auto;
        }
        .modal h3 { font-size: 16px; color: #333; margin-bottom: 16px; }
        .score-item { margin-bottom: 16px; }
        .score-label { font-size: 12px; font-weight: 600; color: #555; margin-bottom: 6px; }
        .score-number { font-size: 20px; color: #667eea; font-weight: 700; }
        .score-feedback { font-size: 12px; color: #777; line-height: 1.5; margin-top: 4px; }
        .general-score { background: #f5f5ff; padding: 14px; border-radius: 8px; margin: 16px 0; }
        .general-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .general-number { font-size: 28px; color: #667eea; font-weight: 700; }
        .tips { background: #fff9e6; padding: 12px; border-radius: 8px; margin: 16px 0; border-left: 3px solid #ffc107; }
        .tips-title { font-size: 11px; font-weight: 600; color: #856404; text-transform: uppercase; margin-bottom: 6px; }
        .tip { font-size: 12px; color: #666; margin-bottom: 6px; line-height: 1.5; }
        .tip:last-child { margin-bottom: 0; }
        .modal-btns { display: flex; gap: 10px; justify-content: center; margin-top: 22px; }
        .modal-btns button {
            padding: 10px 18px; border: none; border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #764ba2; }
        .btn-secondary { background: #f0f0f0; color: #555; }
        .btn-secondary:hover { background: #e0e0e0; }

        /* Modal de confirmación */
        .confirm-modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.4); z-index: 101;
            align-items: center; justify-content: center;
        }
        .confirm-modal.visible { display: flex; }
        .confirm-modal .modal {
            max-width: 360px;
        }

        .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-top:14px; }
        .att-btn {
            padding:16px 12px; background:white; border:2px solid #e0e0e0;
            border-radius:10px; cursor:pointer; text-align:center; transition:all 0.25s; font-family:inherit;
        }
        .att-btn:hover { border-color:#667eea; background:#f5f5ff; }
        .att-btn:disabled { opacity:0.5; cursor:default; }
        .att-btn .ico  { font-size:28px; display:block; margin-bottom:8px; }
        .att-btn .name { font-size:13px; font-weight:600; color:#333; margin-bottom:3px; }
        .att-btn .sub  { font-size:11px; color:#999; }

        .input-area { padding:12px 14px; border-top:1px solid #e0e0e0; display:flex; gap:8px; background:white; flex-wrap: wrap; }
        input[type="text"] {
            flex:1; min-width: 150px; padding:12px 14px; border:1px solid #ddd; border-radius:8px;
            font-size:15px; font-family:inherit; transition:border-color 0.2s;
        }
        input[type="text"]:focus { outline:none; border-color:#667eea; box-shadow:0 0 0 3px rgba(102,126,234,0.1); }
        input[type="text"]:disabled { background:#f5f5f5; }

        .btn-group { display: flex; gap: 10px; }
        .send-btn {
            flex: 1; padding:11px 16px; background:#667eea; color:white; border:none;
            border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; font-family:inherit; transition: background 0.2s;
        }
        .send-btn:hover:not(:disabled){background:#764ba2}
        .send-btn:disabled{background:#ccc;cursor:not-allowed}
        .feedback-btn {
            padding:10px 12px; background:#f9a825; color:white; border:none;
            border-radius:8px; font-size:12px; font-weight:500; cursor:pointer; font-family:inherit; transition: background 0.2s;
            white-space: nowrap; flex-shrink: 0;
        }
        .feedback-btn:hover { background:#f89e0d; }
        .reset-btn {
            padding:10px 12px; background:#f0f0f0; color:#555; border:none;
            border-radius:8px; font-size:12px; cursor:pointer; font-family:inherit; flex-shrink: 0;
        }
        .reset-btn:hover{background:#e0e0e0}
    </style>
</head>
<body>

<!-- Modal de feedback -->
<div class="modal-overlay" id="feedbackModal">
    <div class="modal">
        <h3>📊 Evaluación de la conversación</h3>
        <div id="feedbackContent"></div>
    </div>
</div>

<!-- Modal de confirmación -->
<div class="confirm-modal" id="confirmModal">
    <div class="modal">
        <h3 id="confirmTitle">¿Pasar a la Conversación 2?</h3>
        <p id="confirmMsg">La primera conversación aún no ha terminado. Puedes continuar igualmente.</p>
        <div class="modal-btns">
            <button class="btn-secondary" onclick="closeConfirm()">Quedarme aquí</button>
            <button class="btn-primary" onclick="confirmAction()">Continuar</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="header">
        <h1>💬 Conversación con el equipo</h1>
        <p>Practica cómo construir y sostener acuerdos</p>
        <div class="mode" id="modeLabel"></div>
    </div>

    <div class="phase-bar">
        <div class="phase-tab active" id="tab1">1 · Construir el acuerdo</div>
        <div class="phase-tab" id="tab2">2 · Sostener el acuerdo</div>
    </div>

    <div class="chat-area" id="chatArea"></div>

    <div class="input-area">
        <div class="btn-group">
            <input type="text" id="msgInput" placeholder="Escribe tu mensaje..." disabled autocomplete="off">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>Enviar</button>
        </div>
        <button class="feedback-btn" id="feedbackBtn" onclick="requestFeedback()" disabled title="Recibir evaluación">📊 Evaluar</button>
        <button class="reset-btn" onclick="resetChat()">↻ Reiniciar</button>
    </div>
</div>

<script>
const chatArea      = document.getElementById('chatArea');
const msgInput      = document.getElementById('msgInput');
const sendBtn       = document.getElementById('sendBtn');
const feedbackBtn   = document.getElementById('feedbackBtn');
const modeLabel     = document.getElementById('modeLabel');
const tab1          = document.getElementById('tab1');
const tab2          = document.getElementById('tab2');
const feedbackModal = document.getElementById('feedbackModal');
const confirmModal  = document.getElementById('confirmModal');

let difficulty  = null;
let phase       = 1;
let phase1Done  = false;
let history1    = [];
let history2    = [];
let sys2        = null;
let pendingAction = null;

const nonComplianceReasons = [
    'Se te olvidó cumplir el acuerdo. No fue intencional, se perdió entre otras prioridades. Al principio dices que "estabas en eso" o que "fue una semana complicada". Solo si te preguntan bien lo reconoces.',
    'En el fondo nunca estuviste convencido del acuerdo. Lo aceptaste para no generar conflicto, pero no lo cumpliste porque no crees que sea la solución. Al principio evitas el tema, pero si te presionan empiezas a cuestionar el acuerdo mismo.',
    'Quisiste cumplir pero tuviste un obstáculo real: falta de tiempo, de recursos o de información. No lo comunicaste. Al principio dices que "lo estás resolviendo", pero si te preguntan bien reconoces que necesitabas algo que no tenías.',
    'No entendiste bien qué se esperaba exactamente de ti. El acuerdo te pareció ambiguo. Actuaste según tu propia interpretación, que resultó ser distinta. Al principio dices que sí cumpliste, hasta que queda claro que no es lo mismo.',
    'Entendiste el acuerdo pero tuviste otras urgencias que consideraste más importantes. Al principio lo justificas con esas urgencias, pero si te presionan reconoces que debiste haber comunicado el cambio de prioridad.'
];

const attitudes = {
    easy: {
        emoji:'😊', name:'Actitud positiva', sub:'Apoya pero tiene preguntas',
        system1: `Eres un miembro del equipo hablando con tu jefe o jefa directa. Tu actitud es positiva, de aceptación y curiosa.
- Hablas en primera persona, de forma casual y natural. Eres una persona real.
- Cuando tu jefe propone algo, lo apoyas. Si tienes dudas, haces UNA sola pregunta concreta cada vez con el fin de aclarar y poder implementar lo solicitado.
- Nunca hagas dos preguntas a la vez. Espera la respuesta antes de seguir.
- Tono cálido: "claro, tiene sentido, pero...", "entiendo, y si...".
- Si es necesario tener discordancias, las planteas pero con una actitud aclaratorio, positiva, no cuestionadora. Puedes plantear diferencias pero con apertura.
- No caigas en aceptar todo inmediatamente sino que pide aclaraciones, plantea tu opinión, pero conduciendo a una resolución
- Nunca uses términos de gestión ni listes elementos. Eres un colega normal.
- Cuando todo esté claro di: "ok, me parece bien. Lo llevamos al equipo".
- Máximo 2-3 líneas por respuesta. Habla en español neutro, sin modismos locales.`
    },
    medium: {
        emoji:'🤔', name:'Actitud reflexiva', sub:'Cuestiona de forma balanceada',
        system1: `Eres un miembro del equipo hablando con tu jefe o jefa directa. Tu actitud es reflexiva y algo escéptica.
- Hablas en primera persona, de forma directa y honesta. Tienes tu propia perspectiva.
- Cuando tu jefe propone algo, haces preguntas profundas, para comprender, y promueves activamente pensar más allá de lo dicho con el fin de tener un acuerdo claro. Igualmente, no aceptas respuestas vagas.
- "no me queda del todo claro", "eso me preocupa un poco", "¿y si...?".
- Nunca uses términos de gestión. Eres un colega normal.
- Cuando todo esté claro di: "bueno, así tiene más sentido. Puedo sostenerlo con el equipo".
- Máximo 2-3 líneas. Habla en español neutro, sin modismos locales.`
    },
    hard: {
        emoji:'🎯', name:'Actitud difícil', sub:'Cuestiona sin filtros',
        system1: `Eres un miembro del equipo hablando con tu jefe o jefa directa. Tu actitud es difícil y exigente pero no agresiva, cuidas la cordialidad aunque sea como una base mínima.
- Hablas en primera persona, de forma franca y sin rodeos, pero con respeto.
- Cuando tu jefe propone algo, haces UNA pregunta directa y exigente por turno. No aceptas vaguedades.
- "no me convence", "eso es muy vago", "¿y si no se cumple qué pasa?", "¿quién específicamente?".
- Nunca uses términos de gestión. Eres un colega normal.
- Solo cuando todo esté claro di: "ok, ahora sí me convence. Podemos llevarlo".
- Máximo 2-3 líneas. Habla en español neutro, sin modismos locales.`
    }
};

const greeting1 = { easy: "Hola, me llamaste. ¿Qué hay?", medium: "Hola, me llamaste. Cuéntame.", hard: "Hola, me llamaste. ¿Qué pasa?" };
const greeting2 = { easy: "Hola. ¿Me necesitabas?", medium: "Hola. ¿Qué pasó?", hard: "Hola. Dime." };

function buildSystem2() {
    const reason = nonComplianceReasons[Math.floor(Math.random() * nonComplianceReasons.length)];
    const summary = history1.filter(m => m.role === 'user').map(m => m.content).join(' ');
    return `Eres un miembro del equipo que NO cumplió un acuerdo que habías hecho con tu jefe o jefa.

EL ACUERDO ERA: ${summary || 'un acuerdo de trabajo que habían pactado juntos'}

POR QUÉ NO CUMPLISTE (solo tú lo sabes, no lo digas directamente al principio):
${reason}

CÓMO COMPORTARTE:
- Eres una persona real. Primera persona, tono natural.
- Al principio no admites el incumplimiento fácilmente.
- A medida que tu jefe o jefa te presiona o hace buenas preguntas, vas revelando la razón real.
- Si tu jefe escucha bien y propone soluciones, empiezas a ceder.
- Si solo te presionan sin escucharte, te cierras más.
- Nunca uses términos de gestión. Eres un colega normal.
- Habla en español neutro, sin modismos.
- Máximo 2-3 líneas por respuesta.`;
}

async function callAPI(msgs, system) {
    const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 200,
            system: system,
            messages: msgs
        })
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    return d.content?.[0]?.text || "...";
}

function showTyping() {
    const w = document.createElement('div');
    w.className = 'msg bot'; w.id = 'typing';
    const who = document.createElement('div');
    who.className = 'who'; who.textContent = 'Compañero/a';
    const t = document.createElement('div');
    t.className = 'typing'; t.innerHTML = '<span></span><span></span><span></span>';
    w.appendChild(who); w.appendChild(t);
    chatArea.appendChild(w); chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

function addMsg(role, text) {
    const w = document.createElement('div');
    w.className = `msg ${role === 'user' ? 'user' : 'bot'}`;
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = role === 'user' ? 'Tú (Jefatura)' : 'Compañero/a';
    const b = document.createElement('div');
    b.className = 'bubble'; b.textContent = text;
    w.appendChild(who); w.appendChild(b);
    chatArea.appendChild(w); chatArea.scrollTop = chatArea.scrollHeight;
}

function addDivider(text) {
    const d = document.createElement('div');
    d.className = 'divider';
    d.innerHTML = `<hr><span>${text}</span><hr>`;
    chatArea.appendChild(d); chatArea.scrollTop = chatArea.scrollHeight;
}

async function requestFeedback() {
    msgInput.disabled = true; sendBtn.disabled = true; feedbackBtn.disabled = true;

    const history = phase === 1 ? history1 : history2;
    const isPhase2 = phase === 2;
    const conversationText = history.map(m => `${m.role === 'user' ? 'JEFE' : 'COLEGA'}: ${m.content}`).join('\n');

    const criterios = isPhase2
        ? `1. Bienvenida y contexto a la conversación: ¿El jefe abrió bien la conversación? ¿Fue clara la razón por la que se reunieron?
2. Planteamiento del problema: ¿Explicó de forma clara y específica cuál es el incumplimiento o problema?
3. Impacto del problema: ¿Explicó por qué importa, qué consecuencias tiene que no se haya cumplido?
4. Transmitir requerimiento de forma clara y firme: ¿Dejó claro lo que se espera? ¿Fue directo sin ser agresivo? ¿Puso un límite concreto?
5. Generación de un acuerdo explícito: ¿Cerró con compromisos concretos, verificables y con seguimiento?
6. Advertencia sobre siguiente paso en caso de no cumplimiento: ¿Explicó qué pasará si no se cumple? ¿Fue claro el siguiente paso?`
        : `1. Bienvenida y contexto a la conversación: ¿El jefe abrió bien la conversación? ¿Fue clara la razón por la que se reunieron?
2. Planteamiento del problema: ¿Describió el problema de forma clara y específica?
3. Impacto del problema: ¿Explicó por qué importa resolver esto, qué consecuencias tiene?
4. Abrir conversación para indagar qué pasó: ¿Hizo preguntas abiertas? ¿Escuchó activamente? ¿Buscó entender la perspectiva del otro antes de proponer soluciones?
5. Cierre con un acuerdo explícito: ¿Cerró con compromisos concretos, medibles y verificables? ¿Quedó claro quién hace qué y cuándo?`;

    const userPrompt = `Eres un evaluador experto en habilidades de liderazgo y comunicación.

Evalúa lo que hizo el JEFE en esta conversación según estos criterios (escala 1.0 a 7.0):

${criterios}

REGLAS DE EVALUACIÓN:
- Evalúa SOLO lo que el JEFE dijo en la conversación. Ignora lo que dijo el COLEGA.
- Evalúa cada punto de evaluación con nota 1.0 a 7.0 y utiliza criterio: sin ser demasiado exigentes y entregándoles un feedback que les sirva para mejorar.
- El feedback de cada criterio debe ser específico: menciona qué hizo que no es lo positivo o bien, sugiérele cómo podría ser mejor..
- Considera que una nota bajo 4.0 es equivalente a una reprobación y la conversación es deficiente. Sobre 4.0, es aceptable y mientras mejor sea, más se acerca al 7.0
- La nota general es el promedio de todos los criterios.
- Los 2 tips deben ser concretos y basados en los criterios con peor nota.

CONVERSACIÓN:
${conversationText}

Responde ÚNICAMENTE con JSON válido, sin texto antes ni después, sin markdown:
{"items":[{"label":"nombre exacto del criterio","score":X.X,"feedback":"feedback específico"}],"general_score":X.X,"tip1":"tip concreto","tip2":"tip concreto"}`;

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "claude-sonnet-4-20250514",
                max_tokens: 2000,
                messages: [{ role: 'user', content: userPrompt }]
            })
        });
        
        const data = await response.json();
        let text = data.content?.[0]?.text || '';
        text = text.replace(/```json/g, '').replace(/```/g, '').trim();
        const feedbackData = JSON.parse(text);
        showFeedback(feedbackData);

    } catch (e) {
        console.error('Feedback error:', e);
        msgInput.disabled = false; sendBtn.disabled = false; feedbackBtn.disabled = false;
        alert('Error al generar feedback. Intenta de nuevo.');
    }
}

function showFeedback(data) {
    const content = document.getElementById('feedbackContent');
    content.innerHTML = ''; // Limpiar contenido anterior
    
    let html = '';

    data.items.forEach(item => {
        html += `
            <div class="score-item">
                <div class="score-label">${item.label}</div>
                <div class="score-number">${item.score}</div>
                <div class="score-feedback">${item.feedback}</div>
            </div>
        `;
    });

    html += `
        <div class="general-score">
            <div class="general-label">Nota General</div>
            <div class="general-number">${data.general_score}</div>
        </div>

        <div class="tips">
            <div class="tips-title">💡 Tips para mejorar</div>
            <div class="tip">1. ${data.tip1}</div>
            <div class="tip">2. ${data.tip2}</div>
        </div>
    `;

    content.innerHTML = html;

    const btnContainer = document.createElement('div');
    btnContainer.style.display = 'flex';
    btnContainer.style.gap = '10px';
    btnContainer.style.marginTop = '16px';
    btnContainer.style.justifyContent = 'center';
    btnContainer.style.flexWrap = 'wrap';

    if (phase === 1) {
        btnContainer.innerHTML = `
            <button class="btn-secondary" onclick="repeatPhase1()" style="flex:1; minWidth: 120px; padding:10px;">Hacer de nuevo</button>
            <button class="btn-primary" onclick="goToPhase2FromFeedback()" style="flex:1; minWidth: 120px; padding:10px;">Pasar a Conv. 2</button>
        `;
    } else {
        btnContainer.innerHTML = `
            <button class="btn-secondary" onclick="repeatPhase2()" style="flex:1; minWidth: 120px; padding:10px;">Hacer de nuevo</button>
            <button class="btn-primary" onclick="endConversation()" style="flex:1; minWidth: 120px; padding:10px;">Terminar</button>
        `;
    }

    content.appendChild(btnContainer);
    feedbackModal.classList.add('visible');
}

function goToPhase2FromFeedback() {
    closeFeedback();
    doStartPhase2();
}

function closeFeedback() {
    feedbackModal.classList.remove('visible');
    msgInput.disabled = false; sendBtn.disabled = false; feedbackBtn.disabled = false;
    msgInput.focus();
}

function repeatPhase1() { closeFeedback(); resetChat(); }
function repeatPhase2() {
    closeFeedback();
    chatArea.innerHTML = '';
    msgInput.value = '';
    history2 = [];
    addDivider('Nuevo intento — Conversación 2');
    const first = greeting2[difficulty];
    history2.push({ role: 'assistant', content: first });
    addMsg('bot', first);
    msgInput.disabled = false; sendBtn.disabled = false; feedbackBtn.disabled = false;
    msgInput.focus();
}
function endConversation() {
    closeFeedback();
    addDivider('Conversación finalizada');
    msgInput.disabled = true; sendBtn.disabled = true; feedbackBtn.disabled = true;
}
function moveToPhase2Check() {
    closeFeedback();
    pendingAction = () => doStartPhase2();
    confirmModal.classList.add('visible');
    document.getElementById('confirmTitle').textContent = '¿Pasar a Conversación 2?';
    document.getElementById('confirmMsg').textContent = 'Puedes pasar a la siguiente o continuar refinando.';
}

function closeConfirm() { confirmModal.classList.remove('visible'); pendingAction = null; }
function confirmAction() { confirmModal.classList.remove('visible'); if (pendingAction) pendingAction(); }

function doStartPhase2() {
    phase = 2;
    phase1Done = true;
    sys2 = buildSystem2();

    tab1.classList.remove('active'); tab1.classList.add('done');
    tab2.classList.add('active');
    tab2.classList.remove('clickable');
    modeLabel.textContent = `${attitudes[difficulty].emoji} ${attitudes[difficulty].name} · Fase 2: Sostener el acuerdo`;

    addDivider('Han pasado unos días — Conversación 2');

    const first = greeting2[difficulty];
    history2.push({ role: 'assistant', content: first });
    addMsg('bot', first);

    msgInput.disabled = false; sendBtn.disabled = false; feedbackBtn.disabled = false;
    msgInput.focus();
}

async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;
    msgInput.value = ''; msgInput.disabled = true; sendBtn.disabled = true; feedbackBtn.disabled = true;
    addMsg('user', text);

    const history = phase === 1 ? history1 : history2;
    const system  = phase === 1 ? attitudes[difficulty].system1 : sys2;

    history.push({ role: 'user', content: text });
    showTyping();

    try {
        const reply = await callAPI(history, system);
        hideTyping();
        addMsg('bot', reply);
        history.push({ role: 'assistant', content: reply });

        if (phase === 1) {
            const endPhrases = ['llevamos al equipo', 'me convence', 'podemos llevarlo', 'tiene más sentido', 'me parece bien'];
            if (endPhrases.some(p => reply.toLowerCase().includes(p))) {
                phase1Done = true;
                tab2.classList.add('clickable');
                addDivider('Conversación 1 terminada');
            }
        }
    } catch (e) {
        hideTyping();
        addMsg('bot', 'Error al conectar. Intenta de nuevo.');
    }

    msgInput.disabled = false; sendBtn.disabled = false; feedbackBtn.disabled = false;
    msgInput.focus();
}

function selectAttitude() {
    const w = document.createElement('div'); w.className = 'msg bot';
    const lbl = document.createElement('div');
    lbl.style.cssText = 'font-size:14px;color:#555;margin-bottom:10px;';
    lbl.textContent = 'Elige la actitud de tu contraparte:';
    const grid = document.createElement('div'); grid.className = 'grid';
    Object.entries(attitudes).forEach(([key, att]) => {
        const btn = document.createElement('button'); btn.className = 'att-btn';
        btn.innerHTML = `<span class="ico">${att.emoji}</span><div class="name">${att.name}</div><div class="sub">${att.sub}</div>`;
        btn.onclick = () => {
            grid.querySelectorAll('.att-btn').forEach(b => b.disabled = true);
            setAttitude(key);
        };
        grid.appendChild(btn);
    });
    w.appendChild(lbl); w.appendChild(grid);
    chatArea.appendChild(w); chatArea.scrollTop = chatArea.scrollHeight;
}

function setAttitude(level) {
    difficulty = level;
    modeLabel.textContent = `${attitudes[level].emoji} ${attitudes[level].name} · Fase 1: Construir el acuerdo`;
    tab2.classList.add('clickable');
    msgInput.disabled = false; sendBtn.disabled = false; feedbackBtn.disabled = false;
    const first = greeting1[level];
    history1.push({ role: 'assistant', content: first });
    addMsg('bot', first);
    msgInput.focus();
}

function resetChat() {
    chatArea.innerHTML = ''; msgInput.value = '';
    msgInput.disabled = true; sendBtn.disabled = true; feedbackBtn.disabled = true;
    modeLabel.textContent = ''; difficulty = null;
    phase = 1; phase1Done = false;
    history1 = []; history2 = []; sys2 = null;
    tab1.className = 'phase-tab active';
    tab2.className = 'phase-tab';
    selectAttitude();
}

tab2.addEventListener('click', () => {
    if (phase === 2 || !difficulty) return;
    if (!phase1Done) {
        pendingAction = () => doStartPhase2();
        confirmModal.classList.add('visible');
        document.getElementById('confirmTitle').textContent = '¿Pasar a la Conversación 2?';
        document.getElementById('confirmMsg').textContent = 'La primera conversación aún no ha terminado. Puedes continuar igualmente.';
    } else {
        doStartPhase2();
    }
});

msgInput.addEventListener('keypress', e => { if (e.key === 'Enter' && !msgInput.disabled) sendMessage(); });
window.addEventListener('load', selectAttitude);
</script>
</body>
</html>
